<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>AI 활용 설문</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 24px;
      background: #f4f8ff;
      color: #222;
    }

    .box {
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      margin-top: 28px;
      width: 100%;
      padding: 14px;
      background: #2f80ed;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1f6ed4;
    }

    #result {
      margin-top: 24px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>AI 활용 설문</h1>

    <form id="surveyForm">
      <label>이름</label>
      <input type="text" name="name" required />

      <label>소속/부서</label>
      <input type="text" name="dept" required />

      <label>이메일</label>
      <input type="email" name="email" required />

      <label>1. 생성형 AI를 업무에 활용해 본 경험이 있습니까?</label>
      <select name="q1" required>
        <option value="">선택하세요</option>
        <option value="1">전혀 없다</option>
        <option value="2">조금 있다</option>
        <option value="3">보통이다</option>
        <option value="4">자주 활용한다</option>
        <option value="5">매우 적극적으로 활용한다</option>
      </select>

      <label>2. 생성형 AI 교육이 업무에 도움이 될 것 같습니까?</label>
      <select name="q2" required>
        <option value="">선택하세요</option>
        <option value="1">전혀 그렇지 않다</option>
        <option value="2">그렇지 않다</option>
        <option value="3">보통이다</option>
        <option value="4">그렇다</option>
        <option value="5">매우 그렇다</option>
      </select>

      <button type="submit">제출하기</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxA2rZ27K69Euy8-PXq7i4Sm1mE8kd5orV_3xhc4tR-IXV9wkdAwCJI4pwLTzReeMFu/exec";

    document.getElementById("surveyForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const form = e.target;

      const q1 = Number(form.q1.value);
      const q2 = Number(form.q2.value);
      const total = q1 + q2;

      let type = "";
      if (total >= 8) {
        type = "AI 활용 적극형";
      } else if (total >= 5) {
        type = "AI 활용 관심형";
      } else {
        type = "AI 활용 입문형";
      }

      const data = {
        name: form.name.value,
        dept: form.dept.value,
        email: form.email.value,
        q1: q1,
        q2: q2,
        q3: "",
        q4: "",
        q5: "",
        q6: "",
        q7: "",
        q8: "",
        q9: "",
        q10: "",
        total: total,
        type: type,
        edu: ""
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        document.getElementById("result").innerText =
          "제출이 완료되었습니다. 결과 유형: " + type;

        form.reset();

      } catch (error) {
        document.getElementById("result").innerText =
          "제출 중 오류가 발생했습니다.";
      }
    });
  </script>

</body>
</html>
